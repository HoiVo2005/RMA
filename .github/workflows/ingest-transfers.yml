name: Ingest Transfers

on:
  schedule:
    # 05:00 Asia/Ho_Chi_Minh is 22:00 UTC previous day
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Debug info
        run: |
          node -v
          npm -v
          pwd
          ls -la

      - name: Check Supabase secrets
        run: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "ERROR: Required Supabase secrets are missing. Please set NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in repo secrets.";
            exit 1;
          else
            echo "Supabase secrets present.";
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run ingest-transfers script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        id: ingest
        run: npx tsx scripts/ingest-transfers.ts

      - name: Report ingest result
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          STATUS="${{ job.status }}"
          BODY="Ingest transfers run for $REPO finished with status: $STATUS (ref: ${{ github.ref }})"
          echo "$BODY"
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${REPO}/issues -d "{\"title\": \"Ingest transfers: $STATUS\", \"body\": \"$BODY\"}" || true
