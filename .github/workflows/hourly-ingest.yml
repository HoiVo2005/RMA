name: Lấy tin Real Madrid mỗi giờ

on:
  schedule:
    - cron: '0 * * * *' # chạy đầu mỗi giờ (giờ UTC)
  workflow_dispatch: {} # cho phép bấm chạy tay trong tab Actions trên GitHub

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi API lấy tin
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/ingest"
